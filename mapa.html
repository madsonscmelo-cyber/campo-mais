<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Setor Norte — Priorização de Inspeções (Perdas Não Técnicas)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<style>
:root{--verde:#00A443;--azul:#004F9F;--laranja:#F28C00;--cinza:#f4f6f8;--borda:#e3e8ee}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--cinza)}
header{background:var(--verde);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600;flex:1;min-width:200px}
header .sub{font-size:11.5px;opacity:.9}
#btnFiltros{display:none;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
#layout{display:flex;height:calc(100% - 52px)}
#painel{width:300px;min-width:300px;background:#fff;border-right:1px solid var(--borda);overflow-y:auto;padding:14px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#mapa{flex:1;min-height:50%}
#abaLista{height:42%;border-top:2px solid var(--borda);display:flex;flex-direction:column;background:#fff}
#abaLista .cabec{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--borda)}
#abaLista .cabec h2{font-size:13.5px;margin:0;color:var(--azul);flex:1}
#tabWrap{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{position:sticky;top:0;background:var(--azul);color:#fff;padding:6px 8px;text-align:left;cursor:pointer;white-space:nowrap;font-weight:600}
td{padding:5px 8px;border-bottom:1px solid var(--borda);white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis}
tr:hover td{background:#eef4fb;cursor:pointer}
.bA{background:#FDE8E8;color:#C00000;font-weight:700;border-radius:4px;padding:1px 7px}
.bB{background:#FFF3D6;color:#8a6100;border-radius:4px;padding:1px 7px}
.bC{background:#E8F0FE;color:#1a4d99;border-radius:4px;padding:1px 7px}
.grupo{margin-bottom:12px}
.grupo label.titulo,.grupo .titulo{display:block;font-size:11px;font-weight:700;color:var(--azul);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
select[multiple]{width:100%;height:110px;border:1px solid var(--borda);border-radius:8px;padding:4px;font-size:12.5px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 0;cursor:pointer}
.chk input{accent-color:var(--verde)}
.chk .conta{margin-left:auto;color:#778;background:#f1f4f7;border-radius:8px;padding:0 7px;font-size:11px}
input[type=text]{width:100%;padding:7px 9px;border:1px solid var(--borda);border-radius:8px;font-size:12.5px}
.switch{display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;padding:4px 0}
.switch input{accent-color:var(--laranja);width:16px;height:16px}
button.acao{background:var(--azul);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:12.5px;cursor:pointer;width:100%;margin-top:6px}
button.acao.sec{background:#eef2f6;color:var(--azul)}
#cards{display:flex;gap:10px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--borda);flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:8px 14px;min-width:130px;flex:1}
.card .v{font-size:20px;font-weight:700;color:var(--azul)}
.card .v.a{color:#C00000}.card .v.l{color:var(--laranja)}.card .v.g{color:var(--verde)}
.card .t{font-size:10.5px;color:#667;text-transform:uppercase;letter-spacing:.4px}
#barras{display:flex;gap:10px;padding:8px 12px;background:#fff;border-bottom:1px solid var(--borda)}
.barBox{flex:1;min-width:280px}
.barBox h3{font-size:11px;color:var(--azul);margin:0 0 4px;text-transform:uppercase}
.bar{display:flex;align-items:center;gap:6px;font-size:11px;margin:2px 0}
.bar .nm{width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#445}
.bar .tr{flex:1;background:#eef1f5;border-radius:4px;height:10px;overflow:hidden}
.bar .fl{height:100%;background:var(--verde);border-radius:4px}
.bar .qt{width:44px;text-align:right;color:#667}
.popup h4{margin:0 0 6px;font-size:13.5px;color:var(--azul)}
.popup table{font-size:12px;width:100%}
.popup td{border:0;padding:2px 4px;white-space:normal}
.popup td.k{color:#667;width:38%;vertical-align:top}
.btnsPop{display:flex;gap:6px;margin-top:8px}
.btnsPop a,.btnsPop button{flex:1;text-align:center;text-decoration:none;font-size:12px;padding:7px 8px;border-radius:8px;border:0;cursor:pointer}
.btnsPop a{background:var(--verde);color:#fff}
.btnsPop button{background:var(--azul);color:#fff}
#estadoGeo{font-size:11px;color:#889;padding:4px 12px}
@media(max-width:820px){
 #btnFiltros{display:block}
 #painel{position:fixed;z-index:1200;left:0;top:52px;bottom:0;transform:translateX(-105%);transition:.25s;box-shadow:2px 0 12px rgba(0,0,0,.2)}
 #painel.aberto{transform:none}
 #abaLista{height:45%}
 #cards{overflow-x:auto;flex-wrap:nowrap}
 .card{min-width:110px}
}
</style>
</head>
<body>
<header>
 <h1>Setor Norte — Priorização de Inspeções <span class="sub">Perdas não técnicas · Receita Federal 2026-09 · 25.625 alvos</span></h1>
 <button id="btnFiltros">☰ Filtros</button>
</header>
<div id="layout">
 <div id="painel">
  <div class="grupo"><label class="titulo">Busca livre</label><input type="text" id="fBusca" placeholder="nome, CNPJ ou endereço…"></div>
  <div class="grupo"><label class="titulo">UTD</label><select id="fUtd" multiple></select></div>
  <div class="grupo"><label class="titulo">Município</label><select id="fMun" multiple size="8"></select></div>
  <div class="grupo"><label class="titulo">Classe</label><div id="fClasse"></div></div>
  <div class="grupo"><label class="titulo">Prioridade</label>
   <label class="chk"><input type="checkbox" id="pA" checked> A</label>
   <label class="chk"><input type="checkbox" id="pB" checked> B</label>
   <label class="chk"><input type="checkbox" id="pC" checked> C</label>
  </div>
  <div class="grupo"><label class="titulo">Precisão</label>
   <label class="chk"><input type="checkbox" id="pcO" checked> Original</label>
   <label class="chk"><input type="checkbox" id="pcC" checked> CEP</label>
   <label class="chk"><input type="checkbox" id="pcM" checked> Município</label>
  </div>
  <div class="grupo"><label class="titulo">Porte</label><select id="fPorte" multiple size="3"></select></div>
  <div class="grupo"><label class="titulo">Matriz/Filial</label><select id="fMf" multiple size="2"></select></div>
  <div class="grupo">
   <label class="switch"><input type="checkbox" id="fSinais"> Só com sinais de atenção</label>
  </div>
  <button class="acao sec" id="btnLimpar">Limpar filtros</button>
  <button class="acao" id="btnCSV">⬇ Exportar filtrados (CSV)</button>
 </div>
 <div id="main">
  <div id="cards"></div>
  <div id="barras"></div>
  <div id="estadoGeo">Carregando dados…</div>
  <div id="mapa"></div>
  <div id="abaLista">
   <div class="cabec"><h2>Alvos filtrados (<span id="nTab">0</span>)</h2><span style="font-size:11px;color:#889">clique na linha para centralizar no mapa</span></div>
   <div id="tabWrap"><table id="tab"><thead></thead><tbody></tbody></table></div>
  </div>
 </div>
</div>
<script>
window.DADOS_B64 = [];
</script>
<script src="https://crbftbtixkzwntthjcfw.supabase.co/storage/v1/object/public/mapa/dadosA.js"></script>
<script src="https://crbftbtixkzwntthjcfw.supabase.co/storage/v1/object/public/mapa/dadosB.js"></script>
<script>
const $ = s => document.querySelector(s);
let D = null; // {dic, col}
let idx = [], filtroIdx = [];
const COR_CL = {};
const PALETA = ["#00A443","#004F9F","#F28C00","#8E44AD","#C0392B","#16A085","#2C3E50","#D35400","#27AE60","#7F8C8D","#2980B9","#E74C3C","#F39C12","#1ABC9C","#9B59B6","#34495E","#E67E22","#95A5A6","#2ECC71","#5D6D7E","#AF7AC5","#48C9B0","#F5B041","#76448A","#BA4A00","#1F618D","#7D6608","#186A3B","#78281F","#4A235A","#0B5345","#6E2C00","#17202A","#5B2C6F"];
const COR_PR = {A:"#C0392B", B:"#F28C00", C:"#7F8C8D"};

// ---------- load dos chunks (Supabase Storage, permanente) ----------
async function carregar(){
 const b64 = window.DADOS_B64.join("");
 const bin = Uint8Array.from(atob(b64), c=>c.charCodeAt(0));
 const txt = await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
 D = JSON.parse(txt);
 const g = {"resumo":{"Original":192,"CEP":25433,"Município":0},"ceps_falhados":[]};
 $("#estadoGeo").textContent = `Geocodificação: ${g.resumo.Original} coordenada original · ${g.resumo.CEP} por CEP · ${g.resumo["Município"]} por município (${g.ceps_falhados.length} CEPs sem localização)`;
 montar();
}

// ---------- montagem ----------
function montar(){
 D.dic.cl.forEach((c,i)=>COR_CL[c]=PALETA[i%PALETA.length]);
 const col = D.col, dic = D.dic;
 idx = col.id.map((_,i)=>i);
 fillMulti("#fUtd", dic.utd); fillMulti("#fMun", dic.mun); fillMulti("#fPorte", dic.po); fillMulti("#fMf", dic.mf);
 const cc = {}; col.cl.forEach((v,i)=>cc[dic.cl[v]]=(cc[dic.cl[v]]||0)+1);
 $("#fClasse").innerHTML = dic.cl.map(c=>`<label class="chk"><input type="checkbox" class="fcl" value="${esc(c)}" checked> ${esc(c)} <span class="conta">${cc[c]}</span></label>`).join("");
 document.querySelectorAll(".fcl,#fUtd,#fMun,#fPorte,#fMf,#pA,#pB,#pC,#pcO,#pcC,#pcM,#fSinais,#fBusca")
   .forEach(el=>el.addEventListener("input", ()=>{clearTimeout(window._db);window._db=setTimeout(aplicar,200)}));
 aplicar();
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function fillMulti(sel, arr){$(sel).innerHTML = arr.map(v=>`<option>${esc(v)}</option>`).join("")}

function lerFiltros(){
 const col=D.col, dic=D.dic;
 const utds = [...$("#fUtd").selectedOptions].map(o=>o.value);
 const muns = [...$("#fMun").selectedOptions].map(o=>o.value);
 const cls = new Set([...document.querySelectorAll(".fcl:checked")].map(o=>o.value));
 const prs = new Set([["#pA","A"],["#pB","B"],["#pC","C"]].filter(([s])=>$(s).checked).map(([,v])=>v));
 const pcs = new Set([["#pcO","Original"],["#pcC","CEP"],["#pcM","Município"]].filter(([s])=>$(s).checked).map(([,v])=>v));
 const porte = [...$("#fPorte").selectedOptions].map(o=>o.value);
 const mf = [...$("#fMf").selectedOptions].map(o=>o.value);
 const soSinais = $("#fSinais").checked;
 const q = $("#fBusca").value.trim().toUpperCase();
 return {utds:new Set(utds), muns:new Set(muns), cls, prs, pcs, porte:new Set(porte), mf:new Set(mf), soSinais, q};
}

function aplicar(){
 const f = lerFiltros(), col = D.col, dic = D.dic;
 filtroIdx = idx.filter(i=>{
  if (f.utds.size && !f.utds.has(dic.utd[col.utd[i]])) return false;
  if (f.muns.size && !f.muns.has(dic.mun[col.mun[i]])) return false;
  if (!f.cls.has(dic.cl[col.cl[i]])) return false;
  if (!f.prs.has(dic.pr[col.pr[i]])) return false;
  if (!f.pcs.has(dic.pc[col.pc[i]])) return false;
  if (f.porte.size && !f.porte.has(dic.po[col.po[i]])) return false;
  if (f.mf.size && !f.mf.has(dic.mf[col.mf[i]])) return false;
  if (f.soSinais && !col.si[i]) return false;
  if (f.q){
    const alvo = (col.no[i]+" "+col.rs[i]+" "+col.cnpj[i]+" "+col.en[i]).toUpperCase();
    if (!alvo.includes(f.q)) return false;
  }
  return true;
 });
 const munsVis = new Set(filtroIdx.map(i=>dic.mun[col.mun[i]]));
 [...$("#fMun").options].forEach(o=>{o.disabled = f.utds.size && !munsVis.has(o.value); o.hidden = o.disabled;});
 atualizarMapa(); atualizarKPIs(); atualizarTabela(); atualizarHash();
}

// ---------- mapa ----------
const map = L.map("mapa",{preferCanvas:true,zoomSnap:.25});
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri"});
L.control.layers({"OSM":osm,"Satélite (Esri)":sat},null,{position:"topleft"}).addTo(map);
let cluster=null, heat=null, heatOn=false;
const boundsSetor = L.latLngBounds([-11.97,-43.02],[-8.99,-39.33]);
function corCluster(cluster){
 let a=0,b=0,c=0;
 cluster.getAllChildMarkers().forEach(m=>{const p=D.dic.pr[D.col.pr[m._idx]];if(p==="A")a++;else if(p==="B")b++;else c++;});
 const pr = a>=b&&a>=c?"A":(b>=c?"B":"C");
 return L.divIcon({html:`<div style="background:${COR_PR[pr]}CC;color:#fff;border-radius:50%;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)">${cluster.getChildCount()}</div>`,className:"",iconSize:L.point(34,34)});
}

function atualizarMapa(){
 if (cluster){map.removeLayer(cluster);cluster=null;}
 if (heat){map.removeLayer(heat);heat=null;}
 const ms = filtroIdx.map(i=>{
   const m = L.circleMarker([D.col.la[i],D.col.lo[i]],{
     radius:5, weight:D.dic.pr[D.col.pr[i]]==="A"?2.2:1,
     color:D.dic.pr[D.col.pr[i]]==="A"?"#C00000":"#555",
     fillColor:COR_CL[D.dic.cl[D.col.cl[i]]], fillOpacity:.92});
   m._idx=i; m.bindPopup(popupHTML(i),{maxWidth:420,minWidth:340}); return m;
 });
 cluster = L.markerClusterGroup({chunkedLoading:true, iconCreateFunction:corCluster, maxClusterRadius:55});
 cluster.addLayers(ms);
 map.addLayer(cluster);
 if (heatOn) ligarHeat();
}
function ligarHeat(){
 if (heat){map.removeLayer(heat);}
 const pts = filtroIdx.filter(i=>D.dic.pr[D.col.pr[i]]==="A").map(i=>[D.col.la[i],D.col.lo[i],1]);
 heat = L.heatLayer(pts,{radius:22,blur:16,maxZoom:12,gradient:{0:"#F28C00",.6:"#E74C3C",1:"#7B241C"}});
 map.addLayer(heat);
}
const ctlHeat = L.control({position:"topright"});
ctlHeat.onAdd=function(){const d=L.DomUtil.create("div","");d.style.cssText="background:#fff;border-radius:8px;padding:6px 8px;box-shadow:0 1px 6px rgba(0,0,0,.3)";d.innerHTML=`<label class="switch" style="font-size:12px"><input type="checkbox" id="tgHeat"> Mapa de calor (prio A)</label>`;return d};
ctlHeat.addTo(map);
ctlHeat.getContainer().querySelector("#tgHeat").addEventListener("change",e=>{heatOn=e.target.checked;heatOn?ligarHeat():(heat&&map.removeLayer(heat))});

function popupHTML(i){
 const c=D.col,d=D.dic;
 const nome = c.no[i]||c.rs[i];
 return `<div class="popup"><h4>${esc(nome)}</h4><table>
  <tr><td class="k">Classe</td><td><b>${esc(d.cl[c.cl[i]])}</b> — prioridade <span class="b${d.pr[c.pr[i]]}">${d.pr[c.pr[i]]}</span></td></tr>
  <tr><td class="k">CNPJ</td><td>${esc(c.cnpj[i])}</td></tr>
  <tr><td class="k">CNAE</td><td>${esc(c.cnae[i])} · ${esc(c.dcnae[i])}</td></tr>
  <tr><td class="k">Endereço</td><td>${esc(c.en[i])}${c.ba[i]?" — "+esc(c.ba[i]):""} · CEP ${esc(c.cep[i])}</td></tr>
  <tr><td class="k">Município</td><td>${esc(c.mun[i])} (${esc(d.utd[c.utd[i]])})</td></tr>
  <tr><td class="k">Telefone</td><td>${esc(c.te[i])||"—"}</td></tr>
  <tr><td class="k">Porte</td><td>${esc(d.po[c.po[i]])} · ${esc(d.mf[c.mf[i]])}</td></tr>
  <tr><td class="k">Início ativ.</td><td>${esc(c.ia[i])||"—"}</td></tr>
  <tr><td class="k">Sinais</td><td>${esc(c.si[i])||"—"}</td></tr>
  <tr><td class="k">Precisão</td><td>${esc(d.pc[c.pc[i]])}</td></tr>
 </table><div class="btnsPop">
  <a href="https://www.google.com/maps/dir/?api=1&destination=${c.la[i]},${c.lo[i]}" target="_blank">Abrir no Google Maps</a>
  <button onclick="copiar('${esc(c.cnpj[i])}')">Copiar CNPJ</button>
 </div></div>`;
}
window.copiar = t=>{navigator.clipboard.writeText(t);alert("CNPJ copiado: "+t)};

// ---------- KPIs + barras ----------
function atualizarKPIs(){
 const c=D.col,d=D.dic;
 let a=0,s=0;const muns=new Set();
 filtroIdx.forEach(i=>{if(d.pr[c.pr[i]]==="A")a++;if(c.si[i])s++;muns.add(c.mun[i])});
 $("#cards").innerHTML=`
  <div class="card"><div class="v">${filtroIdx.length.toLocaleString("pt-BR")}</div><div class="t">Alvos filtrados</div></div>
  <div class="card"><div class="v a">${a.toLocaleString("pt-BR")}</div><div class="t">Prioridade A</div></div>
  <div class="card"><div class="v l">${s.toLocaleString("pt-BR")}</div><div class="t">Com sinais</div></div>
  <div class="card"><div class="v g">${muns.size}</div><div class="t">Municípios</div></div>`;
 const porCl={},porU={};
 filtroIdx.forEach(i=>{porCl[d.cl[c.cl[i]]]=(porCl[d.cl[c.cl[i]]]||0)+1;porU[d.utd[c.utd[i]]]=(porU[d.utd[c.utd[i]]]||0)+1});
 const mk=(obj,max)=>Object.entries(obj).sort((x,y)=>y[1]-x[1]).slice(0,8).map(([n,q])=>`<div class="bar"><div class="nm">${esc(n)}</div><div class="tr"><div class="fl" style="width:${q/max*100}%"></div></div><div class="qt">${q}</div></div>`).join("");
 const m1=Math.max(1,...Object.values(porCl)),m2=Math.max(1,...Object.values(porU));
 $("#barras").innerHTML=`<div class="barBox"><h3>Por classe (top 8)</h3>${mk(porCl,m1)}</div><div class="barBox"><h3>Por UTD</h3>${mk(porU,m2)}</div>`;
}

// ---------- tabela ----------
let pag=0,PP=200;
function atualizarTabela(){
 const tab=$("#tab");
 tab.querySelector("thead").innerHTML=`<tr><th>ID</th><th>Prior.</th><th>Classe</th><th>Nome</th><th>Município</th><th>UTD</th><th>Endereço</th><th>Precisão</th></tr>`;
 $("#nTab").textContent=filtroIdx.length.toLocaleString("pt-BR");
 renderLinhas();
}
function renderLinhas(){
 const c=D.col,d=D.dic,tb=$("#tab").querySelector("tbody");
 const ini=pag*PP,fim=ini+PP;
 tb.innerHTML=filtroIdx.slice(ini,fim).map(i=>`<tr data-i="${i}">
  <td>${c.id[i]}</td><td><span class="b${d.pr[c.pr[i]]}">${d.pr[c.pr[i]]}</span></td>
  <td>${esc(d.cl[c.cl[i]])}</td><td>${esc(c.no[i]||c.rs[i])}</td>
  <td>${esc(c.mun[i])}</td><td>${esc(d.utd[c.utd[i]])}</td>
  <td>${esc(c.en[i])}</td><td>${esc(d.pc[c.pc[i]])}</td></tr>`).join("");
 tb.querySelectorAll("tr").forEach(tr=>tr.addEventListener("click",()=>{
  const i=+tr.dataset.i;map.setView([c.la[i],c.lo[i]],15);openPopupAt(i);
 }));
}
function openPopupAt(i){
 cluster.getLayers().forEach(m=>{if(m._idx===i)m.openPopup()});
}
$("#tabWrap").addEventListener("scroll",e=>{
 if(e.target.scrollTop+e.target.clientHeight>=e.target.scrollHeight-40&&(pag+1)*PP<filtroIdx.length){pag++;renderLinhas()}
});

// ---------- CSV ----------
$("#btnCSV").addEventListener("click",()=>{
 const c=D.col,d=D.dic;
 const hdr=["ID","UTD","Município","Classe","Prioridade da classe","Origem da classificação","CNPJ","Razão social","Nome fantasia","CNAE principal","Descrição CNAE","Matriz/Filial","Porte","Início de atividade","Endereço","Bairro","CEP","Telefone","E-mail","Sinais de atenção","Latitude","Longitude","Precisão"];
 const linhas=[hdr.join(";")];
 filtroIdx.forEach(i=>{
  linhas.push([c.id[i],d.utd[c.utd[i]],c.mun[i],d.cl[c.cl[i]],d.pr[c.pr[i]],"",c.cnpj[i],c.rs[i],c.no[i],c.cnae[i],c.dcnae[i],d.mf[c.mf[i]],d.po[c.po[i]],c.ia[i],c.en[i],c.ba[i],c.cep[i],c.te[i],c.si[i],c.la[i],c.lo[i],d.pc[c.pc[i]]].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(";"));
 });
 const blob=new Blob(["\ufeff"+linhas.join("\n")],{type:"text/csv;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="alvos_filtrados.csv";a.click();
});

// ---------- hash de filtros ----------
function atualizarHash(){
 const p=new URLSearchParams();
 const f=lerFiltros();
 if(f.utds.size)p.set("utd",[...f.utds].join("|"));
 if(f.muns.size)p.set("mun",[...f.muns].join("|"));
 const cls=[...f.cls];if(cls.length<D.dic.cl.length)p.set("cl",cls.join("|"));
 ["A","B","C"].forEach(x=>{if(!f.prs.has(x))p.set("sem"+x,"1")});
 if(f.soSinais)p.set("sinais","1");
 const q=$("#fBusca").value.trim();if(q)p.set("q",q);
 history.replaceState(null,"","#"+p.toString());
}
function lerHash(){
 const p=new URLSearchParams(location.hash.slice(1));
 if(p.get("utd"))[...$("#fUtd").options].forEach(o=>o.selected=p.get("utd").split("|").includes(o.value));
 if(p.get("mun"))[...$("#fMun").options].forEach(o=>o.selected=p.get("mun").split("|").includes(o.value));
 if(p.get("cl"))document.querySelectorAll(".fcl").forEach(o=>o.checked=p.get("cl").split("|").includes(o.value));
 if(p.get("semA"))$("#pA").checked=false;if(p.get("semB"))$("#pB").checked=false;if(p.get("semC"))$("#pC").checked=false;
 if(p.get("sinais"))$("#fSinais").checked=true;
 if(p.get("q"))$("#fBusca").value=p.get("q");
}
$("#btnLimpar").addEventListener("click",()=>{location.hash="";location.reload()});
$("#btnFiltros").addEventListener("click",()=>$("#painel").classList.toggle("aberto"));

carregar().then(()=>{lerHash();aplicar();
 setTimeout(()=>{map.invalidateSize();map.fitBounds(boundsSetor,{animate:false});},900);
});
</script>
